services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: make-it-pretty-backend
    container_name: make-it-pretty-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/backend/uploads
    networks:
      - make-it-pretty
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: make-it-pretty-frontend
    container_name: make-it-pretty-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - make-it-pretty
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uploads:

networks:
  make-it-pretty:
    driver: bridge
